<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Famille Cisse — l'arbre familial, construit ensemble. The Cisse family tree, built together.">
<meta name="robots" content="noindex, nofollow">
<!-- Open Graph: when the link is pasted into the family's WhatsApp
     groups, it must arrive as a real preview card — name, words and
     image — not a bare URL. French first, like the app. The image
     lives in the family's own Supabase storage (photos bucket). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Famille Cisse">
<meta property="og:title" content="Famille Cisse — Arbre familial">
<meta property="og:description" content="L'arbre de la Famille Cisse, construit ensemble par toute la famille — cliquez, ajoutez-vous et aidez-nous à le compléter.">
<meta property="og:url" content="https://bengalycisse.com/famille/">
<meta property="og:image" content="https://pylobfhkefukhngrccxv.supabase.co/storage/v1/object/public/photos/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>Famille Cisse — Arbre familial · Family Tree</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="appHeader"></header>
<main id="appMain"></main>
<div id="modalRoot"></div>
<div id="cropRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<!-- Load order matters: config -> countries -> i18n -> data -> family -> supabase adapter -> app -->
<script src="config.js"></script>
<script src="countries.js"></script>
<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="family.js"></script>
<script src="supabase-adapter.js"></script>
<script src="app.js"></script>
</body>
</html>
